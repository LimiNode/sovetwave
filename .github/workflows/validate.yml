name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill metadata
        run: python .github/scripts/validate_skill.py skills/sovetwave
      - name: Validate eval fixtures
        run: python evals/validate_evals.py
      - name: Test voice-card selector
        run: python evals/test_voice_cards.py

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Test POSIX installer
        if: runner.os == 'Linux'
        run: bash tests/installers/smoke.sh
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installers/smoke.ps1
